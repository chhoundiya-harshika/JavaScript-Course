<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
    <button onclick="document.body.innerHTML=num1,num2;">Result</button>
    <button onclick="num1+num2">ADD</button>
    <button onclick="num1-num2">SUB</button>
    <button onclick="num1*num2">MUL</button>
    <button onclick="num1/num2">DIV</button>
    <button onclick="num1%num2">MOD</button>

    <script>
        let num1=10;
        let num2=5;
    </script>
    
</body>
</html>
